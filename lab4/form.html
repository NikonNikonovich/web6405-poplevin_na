<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нумизматика Шпицбергена — Обратная связь</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header__logo">
            <img src="images/arcticugol_logo.png" alt="Логотип Арктикуголь"
                 width="60" class="header__logo-image">
            <h1 class="header__logo-title">Монеты Шпицбергена</h1>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav__link">Главная</a>
            <a href="history.html" class="nav__link">История</a>
            <a href="catalog.html" class="nav__link">Каталог</a>
            <a href="form.html" class="nav__link nav__link--active">Обратная связь</a>
        </nav>
    </header>

    <main class="main">
        <section class="content">
            <h2 class="content__title">Обратная связь</h2>
            <p class="content__text">
                Оставьте заявку — мы свяжемся с вами по вопросам коллекционирования.
            </p>

            <form class="contact-form" id="contact-form" novalidate>
                <div class="contact-form__field">
                    <label for="name" class="contact-form__label">Ваше имя</label>
                    <input type="text" id="name" name="name"
                           class="contact-form__input"
                           placeholder="Иван Иванов" required>
                </div>

                <div class="contact-form__field">
                    <label for="email" class="contact-form__label">Email</label>
                    <input type="email" id="email" name="email"
                           class="contact-form__input"
                           placeholder="you@example.com" required>
                </div>

                <div class="contact-form__field">
                    <label for="topic" class="contact-form__label">Тема обращения</label>
                    <select id="topic" name="topic" class="contact-form__input">
                        <option value="buy">Хочу купить монету</option>
                        <option value="sell">Хочу продать монету</option>
                        <option value="question">Задать вопрос</option>
                    </select>
                </div>

                <div class="contact-form__field">
                    <label for="message" class="contact-form__label">Сообщение</label>
                    <textarea id="message" name="message"
                              class="contact-form__input contact-form__input--textarea"
                              rows="4" placeholder="Ваше сообщение..."></textarea>
                </div>

                <div class="contact-form__field contact-form__field--checkbox">
                    <input type="checkbox" id="consent" name="consent"
                           class="contact-form__checkbox" required>
                    <label for="consent"
                           class="contact-form__label contact-form__label--checkbox">
                        Согласен на обработку персональных данных
                    </label>
                </div>

                <button type="submit" class="btn contact-form__button">Отправить</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2026. Лабораторная работа №4. Web-программирование.</p>
        <p class="footer__text">
            <a href="https://ru.wikipedia.org/wiki/Шпицберген"
               target="_blank" class="footer__link">Узнать больше о Шпицбергене</a>
        </p>
    </footer>

    <script src="form.js"></script>
</body>
</html>
